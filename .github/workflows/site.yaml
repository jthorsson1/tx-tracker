name: Build and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch results from civicAPI
        run: python fetch_results.py
      - name: Update night-chart history
        run: python history.py
      - name: Show what will be published
        run: |
          ls -l
          python -c "import json; d=json.load(open('data.json')); print(d['status'])"
      - name: Collect site files
        run: |
          mkdir site
          cp index.html data.json share.png history.json site/ 
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
